<style>
/* Concepto: un juguete sobre la mesa. El tablero 3D ocupa todo; la interfaz es vidrio esmerilado que se tiñe con la paleta activa. */
:root{
  --bg1:#ffe9f3; --bg2:#d9f2ff;
  --ui-bg:rgba(255,255,255,.72); --ui-fg:#2a1736; --ui-dim:rgba(42,23,54,.62); --ui-line:rgba(42,23,54,.14);
  --accent:#ff3d77; --accent-fg:#ffffff;
  --display:'Bagel Fat One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Baloo 2','Nunito','Avenir Next Rounded',system-ui,-apple-system,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --pad-l:max(14px,env(safe-area-inset-left,0px)); --pad-r:max(14px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:linear-gradient(165deg,var(--bg1),var(--bg2));background-color:var(--bg1);color:var(--ui-fg);font-family:var(--body);font-weight:600;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;transition:background-color .4s}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-appearance:none;appearance:none;padding:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.glass{background:var(--ui-bg);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--ui-line)}

/* Barra superior */
#top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:max(10px,env(safe-area-inset-top,0px)) var(--pad-r) 8px var(--pad-l);pointer-events:none;z-index:5}
#brand{font-family:var(--display);font-size:clamp(24px,6.4vw,34px);line-height:1;letter-spacing:.01em;color:var(--accent);
  text-shadow:0 2px 0 rgba(255,255,255,.55),0 6px 18px rgba(0,0,0,.12);margin:0;font-weight:400}
#brand small{display:block;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ui-dim);text-shadow:none;margin-top:3px}
#hud{display:flex;gap:8px;align-items:center;pointer-events:auto}
.pill{border-radius:999px;padding:6px 14px;min-height:40px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.pill b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1}
.pill span{font-size:12px;color:var(--ui-dim);line-height:1.05;font-weight:700}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform .16s var(--ease-out)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Dock inferior */
#bottom{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:0 var(--pad-r) max(12px,env(safe-area-inset-bottom,0px)) var(--pad-l);z-index:6;pointer-events:none}
#dock{display:flex;align-items:center;gap:10px;pointer-events:auto}
.btn{height:52px;border-radius:999px;display:flex;align-items:center;gap:8px;padding:0 20px;font-weight:800;font-size:16px;transition:transform .16s var(--ease-out)}
.btn:active{transform:scale(.96)}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
#flip{background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-weight:400;font-size:21px;height:60px;padding:0 30px;
  box-shadow:0 10px 26px -6px var(--accent),inset 0 -4px 0 rgba(0,0,0,.14),inset 0 3px 0 rgba(255,255,255,.35)}
#flip.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 150px);z-index:4;pointer-events:none;
  padding:9px 18px;border-radius:999px;font-size:15px;font-weight:700;white-space:nowrap;transition:opacity .5s,transform .5s var(--ease-out)}
#hint.off{opacity:0;transform:translateX(-50%) translateY(8px)}
#toast{position:fixed;left:50%;top:calc(max(10px,env(safe-area-inset-top,0px)) + 66px);transform:translate(-50%,-10px);opacity:0;z-index:7;pointer-events:none;
  padding:10px 20px;border-radius:999px;font-family:var(--display);font-weight:400;font-size:20px;color:var(--accent);transition:opacity .25s,transform .35s var(--ease-out);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Panel de estilo */
#sheet{width:min(100%,640px);max-height:min(44vh,380px);display:none;flex-direction:column;border-radius:26px;overflow:hidden;pointer-events:auto;
  box-shadow:0 18px 50px -12px rgba(0,0,0,.35);transform-origin:50% 100%}
#sheet.open{display:flex;animation:sheetIn .32s var(--ease-out)}
@keyframes sheetIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
#tabwrap{position:relative;display:flex;align-items:stretch;flex:none;border-bottom:1px solid var(--ui-line)}
#tabs{display:flex;gap:2px;padding:8px 6px 0;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;touch-action:pan-x}
#tabs::-webkit-scrollbar{display:none}
.tabarrow{flex:none;width:34px;display:grid;place-items:center;color:var(--ui-fg);opacity:.85;transition:opacity .2s,background .2s}
.tabarrow svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tabarrow[disabled]{opacity:.2;cursor:default}
@media (hover:hover){.tabarrow:not([disabled]):hover{background:var(--ui-line)}}
.tab{padding:8px 13px 10px;font-weight:800;font-size:14px;color:var(--ui-dim);border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ui-fg);border-bottom-color:var(--accent)}
#chips{padding:12px;overflow-y:scroll;scrollbar-width:thin;scrollbar-color:var(--accent) transparent;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#chips::-webkit-scrollbar{width:10px}#chips::-webkit-scrollbar-track{background:var(--ui-line);border-radius:10px;margin:8px 0}#chips::-webkit-scrollbar-thumb{background:var(--accent);border-radius:10px;border:2px solid transparent;background-clip:content-box}
.chip{display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:8px;border-radius:16px;border:2px solid var(--ui-line);background:rgba(255,255,255,.35);text-align:left;font-size:13px;font-weight:800;line-height:1.1;min-width:0;transition:transform .16s var(--ease-out)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed=true]{border-color:var(--accent);background:rgba(255,255,255,.62);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.chip .sw{height:38px;border-radius:11px;display:block;position:relative;overflow:hidden}
.chip .sw svg{position:absolute;inset:0;width:100%;height:100%}
.chip em{font-style:normal;font-size:11px;font-weight:600;color:var(--ui-dim);display:block;margin-top:2px}
.chip.world .sw{height:48px}
@media (hover:hover) and (pointer:fine){.chip:hover{transform:translateY(-2px)}.icon-btn:hover,.btn:hover{transform:translateY(-1px)}}

/* Panel lateral: escritorio, tablet horizontal y móvil apaisado */
@media (min-width:900px),(orientation:landscape) and (min-width:560px) and (max-height:540px){
  #sheet{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(max(10px,env(safe-area-inset-top,0px)) + 62px);bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 4px);width:min(340px,42vw);max-height:none}
  #chips{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
  #hint{bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 90px)}
  body.sheet-open #bottom{right:calc(min(340px,42vw) + max(12px,env(safe-area-inset-right,0px)) + 8px)}
  body.sheet-open #hint{left:calc((100% - min(340px,42vw) - 20px) / 2)}
}
@media (orientation:landscape) and (max-height:540px){
  #top{padding-top:max(6px,env(safe-area-inset-top,0px))}#brand{font-size:22px}#brand small{display:none}
  .btn{height:44px}#flip{height:48px;font-size:18px}.pill{min-height:34px}.icon-btn{width:38px;height:38px}
  #hint{display:none}
}
@media (max-height:620px) and (orientation:portrait){#sheet{max-height:50vh}}
@media (max-width:520px){.btn.glass{width:52px;padding:0;justify-content:center;font-size:0;gap:0}.btn.glass svg{width:24px;height:24px}}
@media (max-width:380px){.btn{padding:0 14px;font-size:14px}#flip{padding:0 22px;font-size:19px}.pill span{display:none}}
@media (prefers-reduced-motion:reduce){#flip.pulse{animation:none}#sheet.open{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#fail{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;z-index:20;font-size:18px}
</style>
</head>

}
function tabArrows() { const el = $('#tabs'); $('#tprev').disabled = el.scrollLeft < 4; $('#tnext').disabled = el.scrollLeft + el.clientWidth >= el.scrollWidth - 4; }
